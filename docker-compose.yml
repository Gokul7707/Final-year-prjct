# GenesisAI Phase 1 — hangar + forge CAD loop (OpenSCAD whoop STL)
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_PROXY_API=http://backend:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174
      - OPENSCAD_PATH=/usr/bin/openscad
      - PROJECT_ROOT=/project
      - WHOOP_SCAD=/project/cad/whoop/whoop.scad
      - OUTPUT_DIR=/project/output/chassis
      - JOBS_DATA_DIR=/project/backend/data/jobs
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./cad:/project/cad:ro
      - ./output:/project/output
      - ./backend/data:/project/backend/data
    command: npm run dev
